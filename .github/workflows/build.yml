name: Compilar P Music Windows
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Abrir el proyecto (zip subido)
        shell: pwsh
        run: |
          if (-not (Test-Path src/PMusic/PMusic.csproj)) {
            $z = Get-Item PMusic-Windows.zip -ErrorAction SilentlyContinue
            if ($null -eq $z) { $z = Get-ChildItem -Filter *.zip | Select-Object -First 1 }
            if ($null -eq $z) { Write-Error "Sube primero el zip del proyecto"; exit 1 }
            Expand-Archive $z.FullName -DestinationPath . -Force
          }
      - name: Compilar PMusic.exe
        run: dotnet publish src/PMusic/PMusic.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: PMusic-Windows
          path: out/PMusic.exe
      - name: Publicar en Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${{ github.run_number }}" out/PMusic.exe --title "P Music Windows 1.0.${{ github.run_number }}" --notes "Descarga PMusic.exe y ábrelo (Windows 10/11 de 64 bits)."
